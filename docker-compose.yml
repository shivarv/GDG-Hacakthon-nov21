services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
      POSTGRES_DB: helpdesk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local SMTP + IMAP server for development. Mail sent to
  # support@helpdesk.local lands in the mailbox the backend polls.
  mail:
    image: greenmail/standalone:2.0.1
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=support:support@helpdesk.local
        -Dgreenmail.users.login=email
    ports:
      - "3025:3025"   # SMTP
      - "3143:3143"   # IMAP

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://helpdesk:helpdesk@db:5432/helpdesk
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      EMAIL_LISTENER_ENABLED: "true"
      IMAP_HOST: mail
      IMAP_PORT: 3143
      IMAP_USERNAME: support@helpdesk.local
      IMAP_PASSWORD: support
      IMAP_POLL_INTERVAL_SECONDS: 10
      SMTP_ENABLED: "true"
      SMTP_HOST: mail
      SMTP_PORT: 3025
      SUPPORT_FROM_ADDRESS: support@helpdesk.local
      # Public temp address (mail.tm) so you can email cases in from Gmail
      TEMP_INBOX_ENABLED: "true"
    volumes:
      - backend_data:/code/.data   # keeps the temp inbox address across restarts
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_data:
